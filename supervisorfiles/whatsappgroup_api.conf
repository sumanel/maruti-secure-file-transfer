[program:whatsappgroup_api]
directory=/whatsappgroup/backend/whatsapp-group-automation/apps/api
command=/whatsappgroup/backend/apienv/bin/uvicorn server:app --host 0.0.0.0 --port 8000 --workers 2
user=ec2-user
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/whatsappgroup/logs/whatsappgroup_api.log
stderr_logfile=/whatsappgroup/logs/whatsappgroup_api_error.log