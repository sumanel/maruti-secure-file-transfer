[program:whatsappgroup_webhook_celery]
directory=/whatsappgroup/backend/whatsapp-group-automation/apps/webhook
command=/whatsappgroup/backend/webenv/bin/celery -A celery_app worker -Q wg_webhook -l info
user=ec2-user
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/whatsappgroup/logs/whatsappgroup_webhook_celery.log
stderr_logfile=/whatsappgroup/logs/whatsappgroup_webhook_celery_error.log