[program:whatsappgroup_api_celery]
directory=/whatsappgroup/backend/whatsapp-group-automation/apps/api
command=/whatsappgroup/backend/apienv/bin/celery -A celery_app worker -Q wg_api -l info
user=ec2-user
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/whatsappgroup/logs/whatsappgroup_api_celery.log
stderr_logfile=/whatsappgroup/logs/whatsappgroup_api_celery_error.log
