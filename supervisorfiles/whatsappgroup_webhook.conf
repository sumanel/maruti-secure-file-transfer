[program:whatsappgroup_webhook]
directory=/whatsappgroup/backend/whatsapp-group-automation/apps/webhook
command=/whatsappgroup/backend/webenv/bin/gunicorn app:app -k gevent -w 2 --worker-connections 25 --timeout 120 --bind 0.0.0.0:8080
user=ec2-user
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/whatsappgroup/logs/whatsappgroup_webhook.log
stderr_logfile=/whatsappgroup/logs/whatsappgroup_webhook_error.log
